<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Maze - Pac-Man</title>
  <style>
    :root {
      --yellow: #ffe600;
      --cyan: #00eaff;
      --white: #f8fbff;
      --panel: rgba(2, 6, 23, 0.86);
    }
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #111d5c 0%, #05091f 44%, #010208 100%);
}

.game-shell {
  width: min(100%, 900px);
  padding: 18px;
  text-align: center;
}

h1 {
  margin: 0 0 4px;
  color: var(--yellow);
  font-size: clamp(2rem, 7vw, 4.4rem);
  letter-spacing: .12em;
  text-shadow:
    0 0 8px #fff36a,
    0 0 18px #ffe600,
    0 0 35px #ff9d00;
}

.subtitle {
  margin: 0 0 16px;
  color: #a9b7ff;
  font-size: .78rem;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.top-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: min(92vw, 720px);
  margin: 0 auto 12px;
  padding: 10px;
  border: 1px solid rgba(0, 234, 255, .55);
  border-radius: 14px;
  background: var(--panel);
  box-shadow:
    0 0 20px rgba(0, 234, 255, .18),
    inset 0 0 18px rgba(0, 234, 255, .06);
}

.stat-label {
  display: block;
  margin-bottom: 3px;
  color: #91a2e9;
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.stat-value {
  color: var(--yellow);
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 800;
}

#game-container {
  width: min(94vw, 720px);
  margin: 0 auto;
  padding: 7px;
  border: 3px solid var(--cyan);
  border-radius: 18px;
  background: #000;
  box-shadow:
    0 0 10px var(--cyan),
    0 0 35px rgba(0, 234, 255, .35),
    inset 0 0 25px rgba(0, 234, 255, .1);
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #000;
  border-radius: 10px;
  image-rendering: pixelated;
  touch-action: none;
}

.message {
  min-height: 28px;
  margin: 12px 0 5px;
  color: var(--yellow);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-shadow: 0 0 10px rgba(255, 230, 0, .8);
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0;
}

button {
  border: 1px solid var(--cyan);
  border-radius: 10px;
  padding: 10px 18px;
  color: white;
  background: rgba(0, 234, 255, .08);
  cursor: pointer;
  font: inherit;
  font-weight: 800;
  transition: .2s ease;
  touch-action: manipulation;
}

button:hover,
button:focus-visible {
  color: #001018;
  background: var(--cyan);
  box-shadow: 0 0 18px var(--cyan);
  outline: none;
  transform: translateY(-2px);
}

.touch-controls {
  display: none;
  width: 220px;
  margin: 14px auto 0;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.touch-controls button {
  min-height: 50px;
  padding: 8px;
  font-size: 1.3rem;
}

.touch-controls .up {
  grid-column: 2;
}

.touch-controls .left {
  grid-column: 1;
  grid-row: 2;
}

.touch-controls .down {
  grid-column: 2;
  grid-row: 2;
}

.touch-controls .right {
  grid-column: 3;
  grid-row: 2;
}

.instructions {
  margin: 14px auto 0;
  color: #9da9d8;
  font-size: .82rem;
  line-height: 1.6;
}

.instructions span {
  color: var(--cyan);
}

@media (max-width: 650px) {
  .game-shell {
    padding: 12px 8px;
  }

  .touch-controls {
    display: grid;
  }
}

  </style>
</head>
<body>
  <main class="game-shell">
    <h1>NEON MAZE</h1>
    <p class="subtitle">A custom Pac-Man adventure</p>
<section class="top-bar" aria-label="Game statistics">
  <div>
    <span class="stat-label">Score</span>
    <span class="stat-value" id="score">0</span>
  </div>

  <div>
    <span class="stat-label">High Score</span>
    <span class="stat-value" id="high-score">0</span>
  </div>

  <div>
    <span class="stat-label">Lives</span>
    <span class="stat-value" id="lives">3</span>
  </div>

  <div>
    <span class="stat-label">Level</span>
    <span class="stat-value" id="level">1</span>
  </div>
</section>

<div id="game-container">
  <canvas
    id="game"
    width="840"
    height="720"
    aria-label="Neon Maze Pac-Man game"
  ></canvas>
</div>

<div class="message" id="message">
  Press an arrow key or WASD to start
</div>

<div class="controls">
  <button id="pause-button" type="button">Pause</button>
  <button id="restart-button" type="button">Restart</button>
</div>

<div class="touch-controls" aria-label="Touch controls">
  <button class="up" type="button" data-direction="up">▲</button>
  <button class="left" type="button" data-direction="left">◀</button>
  <button class="down" type="button" data-direction="down">▼</button>
  <button class="right" type="button" data-direction="right">▶</button>
</div>

<p class="instructions">
  Move with <span>Arrow Keys</span> or <span>WASD</span>.
  Eat pellets, grab power orbs, and chase frightened ghosts.
</p>

  </main>
  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("high-score");
    const livesElement = document.getElementById("lives");
    const levelElement = document.getElementById("level");
    const messageElement = document.getElementById("message");
    const pauseButton = document.getElementById("pause-button");
    const restartButton = document.getElementById("restart-button");

    const TILE = 40;
    const ROWS = 18;
    const COLS = 21;
    const WIDTH = COLS * TILE;
    const HEIGHT = ROWS * TILE;

    const WALL = "#";
    const PELLET = ".";
    const POWER = "o";
    const EMPTY = " ";
    const GATE = "-";
    const PLAYER = "P";

    /*
      Important map fixes:
      - The ghost house is open instead of being made from solid blocks.
      - The tunnel is on row 8 and is open from both sides.
      - Every power orb is connected to the walkable maze.
      - The player spawn is in a connected lower section.
    */
    const originalMap = [
      "#####################",
      "#o........#........o#",
      "#.###.###.#.###.###.#",
      "#...................#",
      "#.###.#.#####.#.###.#",
      "#.....#...#...#.....#",
      "#####.###.#.###.#####",
      "    #.#...-...#.#    ",
      "    #.#.......#.#    ",
      "    #.#.#####.#.#    ",
      "#####.#.......#.#####",
      "#.....#...#...#.....#",
      "#.###.#.#####.#.###.#",
      "#...................#",
      "#.###.###.#.###.###.#",
      "#o..#.....P.....#..o#",
      "#...#...........#...#",
      "#####################"
    ];

    const directions = {
      up: { x: 0, y: -1, name: "up" },
      down: { x: 0, y: 1, name: "down" },
      left: { x: -1, y: 0, name: "left" },
      right: { x: 1, y: 0, name: "right" },
      none: { x: 0, y: 0, name: "none" }
    };

    const directionList = [
      directions.up,
      directions.left,
      directions.down,
      directions.right
    ];

    const ghostColors = [
      "#ff3b3b",
      "#ff83e9",
      "#00eaff",
      "#ff9d28"
    ];

    let map = [];
    let player = null;
    let ghosts = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let highScore = Number(localStorage.getItem("neonMazeHighScore") || 0);
    let gameStarted = false;
    let paused = false;
    let gameOver = false;
    let levelTransition = false;
    let lastTime = 0;
    let animationId = null;
    let frightenedChain = 0;

    highScoreElement.textContent = highScore.toLocaleString();

    function cloneMap() {
      return originalMap.map(row =>
        row.padEnd(COLS, " ").slice(0, COLS).split("")
      );
    }

    function findCharacter(character) {
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          if (map[row][col] === character) {
            return { row, col };
          }
        }
      }

      return { row: 1, col: 1 };
    }

    function isInside(row, col) {
      return row >= 0 && row < ROWS && col >= 0 && col < COLS;
    }

    function isWall(row, col) {
      return !isInside(row, col) || map[row][col] === WALL;
    }

    function isGate(row, col) {
      return isInside(row, col) && map[row][col] === GATE;
    }

    function isTunnelRow(row) {
      return row === 8;
    }

    function wrapColumn(col) {
      if (col < 0) return COLS - 1;
      if (col >= COLS) return 0;
      return col;
    }

    function canMove(row, col, direction, isGhost = false) {
      if (!direction || direction === directions.none) {
        return false;
      }

      const nextRow = row + direction.y;
      let nextCol = col + direction.x;

      if (isTunnelRow(nextRow)) {
        nextCol = wrapColumn(nextCol);
      }

      if (!isInside(nextRow, nextCol)) {
        return false;
      }

      if (isWall(nextRow, nextCol)) {
        return false;
      }

      if (!isGhost && isGate(nextRow, nextCol)) {
        return false;
      }

      return true;
    }

    function positionToPixels(row, col) {
      return {
        x: col * TILE + TILE / 2,
        y: row * TILE + TILE / 2
      };
    }

    function createPlayer() {
      const start = findCharacter(PLAYER);

      map[start.row][start.col] = EMPTY;

      const position = positionToPixels(start.row, start.col);

      return {
        row: start.row,
        col: start.col,
        x: position.x,
        y: position.y,
        direction: directions.none,
        nextDirection: directions.none,
        speed: 145,
        radius: TILE * .37,
        mouth: 0
      };
    }

    function createGhost(row, col, color, name, personality) {
      const position = positionToPixels(row, col);

      return {
        row,
        col,
        x: position.x,
        y: position.y,
        color,
        name,
        personality,
        direction: directions.left,
        nextDirection: directions.left,
        speed: 82 + Math.min(level * 4, 24),
        frightened: false,
        frightenedTimer: 0,
        eaten: false
      };
    }

    function createGhosts() {
      /*
        Ghosts now begin in open walkable cells.
        Their starting cells are connected to the gate and main maze.
      */
      return [
        createGhost(8, 9, ghostColors[0], "BLAZE", "chaser"),
        createGhost(8, 10, ghostColors[1], "PIXEL", "ambusher"),
        createGhost(8, 8, ghostColors[2], "WAVE", "scatter"),
        createGhost(8, 11, ghostColors[3], "NOVA", "random")
      ];
    }

    function resetGame() {
      cancelAnimationFrame(animationId);

      map = cloneMap();
      score = 0;
      lives = 3;
      level = 1;
      gameStarted = false;
      paused = false;
      gameOver = false;
      levelTransition = false;
      frightenedChain = 0;

      player = createPlayer();
      ghosts = createGhosts();

      updateInterface();

      pauseButton.textContent = "Pause";
      messageElement.textContent = "Press an arrow key or WASD to start";

      draw();
    }

    function resetPositions() {
      player = createPlayer();
      ghosts = createGhosts();
      frightenedChain = 0;

      messageElement.textContent = "Ready!";
    }

    function startGame() {
      if (gameOver) {
        resetGame();
      }

      if (!gameStarted && !levelTransition) {
        gameStarted = true;
        paused = false;
        messageElement.textContent = "";
        lastTime = performance.now();
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function togglePause() {
      if (!gameStarted || gameOver || levelTransition) {
        return;
      }

      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
      messageElement.textContent = paused ? "Game paused" : "";

      if (!paused) {
        lastTime = performance.now();
        animationId = requestAnimationFrame(gameLoop);
      }

      draw();
    }

    function setDirection(name) {
      if (!directions[name]) {
        return;
      }

      if (gameOver) {
        resetGame();
      }

      player.nextDirection = directions[name];
      startGame();
    }

    function getCell(entity) {
      return map[entity.row]?.[entity.col] || EMPTY;
    }

    function collectItems() {
      const cell = getCell(player);

      if (cell === PELLET) {
        map[player.row][player.col] = EMPTY;
        score += 10;
      }

      if (cell === POWER) {
        map[player.row][player.col] = EMPTY;
        score += 50;
        frightenedChain = 0;

        ghosts.forEach(ghost => {
          if (!ghost.eaten) {
            ghost.frightened = true;
            ghost.frightenedTimer = Math.max(5.5, 8 - level * .35);
            ghost.direction = opposite(ghost.direction);
            ghost.nextDirection = ghost.direction;
          }
        });
      }
    }

    function opposite(direction) {
      if (!direction) {
        return directions.none;
      }

      if (direction === directions.up) {
        return directions.down;
      }

      if (direction === directions.down) {
        return directions.up;
      }

      if (direction === directions.left) {
        return directions.right;
      }

      if (direction === directions.right) {
        return directions.left;
      }

      return directions.none;
    }

    function snapToCell(entity) {
      entity.x = entity.col * TILE + TILE / 2;
      entity.y = entity.row * TILE + TILE / 2;
    }

    function advanceEntityCell(entity) {
      let nextRow = entity.row + entity.direction.y;
      let nextCol = entity.col + entity.direction.x;

      if (isTunnelRow(nextRow)) {
        nextCol = wrapColumn(nextCol);
      }

      entity.row = nextRow;
      entity.col = nextCol;

      if (isTunnelRow(entity.row) && entity.col === 0) {
        entity.x = TILE / 2;
      }

      if (isTunnelRow(entity.row) && entity.col === COLS - 1) {
        entity.x = WIDTH - TILE / 2;
      }
    }

    function moveEntity(entity, dt, isGhost = false) {
      let remaining = entity.speed * dt;

      while (remaining > 0) {
        const centerX = entity.col * TILE + TILE / 2;
        const centerY = entity.row * TILE + TILE / 2;

        const nearCenter =
          Math.abs(entity.x - centerX) < 1.2 &&
          Math.abs(entity.y - centerY) < 1.2;

        if (nearCenter) {
          snapToCell(entity);

          if (
            entity.nextDirection &&
            canMove(entity.row, entity.col, entity.nextDirection, isGhost)
          ) {
            entity.direction = entity.nextDirection;
          }

          if (!canMove(entity.row, entity.col, entity.direction, isGhost)) {
            entity.direction = directions.none;
          }

          if (entity.direction === directions.none) {
            break;
          }

          advanceEntityCell(entity);
        }

        const nextCenterX = entity.col * TILE + TILE / 2;
        const nextCenterY = entity.row * TILE + TILE / 2;

        const distanceToCenter = Math.hypot(
          nextCenterX - entity.x,
          nextCenterY - entity.y
        );

        const step = Math.min(
          remaining,
          Math.max(distanceToCenter, 0.01)
        );

        entity.x += entity.direction.x * step;
        entity.y += entity.direction.y * step;
        remaining -= step;

        if (isTunnelRow(entity.row)) {
          if (entity.x < -TILE / 2) {
            entity.col = COLS - 1;
            entity.x = WIDTH - TILE / 2;
          }

          if (entity.x > WIDTH + TILE / 2) {
            entity.col = 0;
            entity.x = TILE / 2;
          }
        }
      }
    }

    function updatePlayer(dt) {
      moveEntity(player, dt, false);
      player.mouth += dt * 13;
      collectItems();
    }

    function getAvailableDirections(ghost) {
      return directionList.filter(direction => {
        if (!canMove(ghost.row, ghost.col, direction, true)) {
          return false;
        }

        const reverseDirection = opposite(ghost.direction);

        return (
          direction !== reverseDirection ||
          ghost.direction === directions.none
        );
      });
    }

    function ghostTarget(ghost) {
      if (ghost.personality === "random") {
        return {
          row: player.row,
          col: player.col
        };
      }

      if (ghost.personality === "scatter") {
        return {
          row: ROWS - 2,
          col: 1
        };
      }

      if (ghost.personality === "ambusher") {
        return {
          row: Math.max(
            1,
            Math.min(ROWS - 2, player.row + player.direction.y * 4)
          ),
          col: Math.max(
            1,
            Math.min(COLS - 2, player.col + player.direction.x * 4)
          )
        };
      }

      return {
        row: player.row,
        col: player.col
      };
    }

    function chooseGhostDirection(ghost) {
      const options = getAvailableDirections(ghost);

      if (!options.length) {
        ghost.direction = opposite(ghost.direction);
        ghost.nextDirection = ghost.direction;
        return;
      }

      if (ghost.frightened) {
        ghost.direction =
          options[Math.floor(Math.random() * options.length)];
        ghost.nextDirection = ghost.direction;
        return;
      }

      const target = ghostTarget(ghost);
      let bestDirection = options[0];
      let bestDistance = Infinity;

      for (const direction of options) {
        let row = ghost.row + direction.y;
        let col = ghost.col + direction.x;

        if (isTunnelRow(row)) {
          col = wrapColumn(col);
        }

        const distance =
          Math.abs(row - target.row) +
          Math.abs(col - target.col);

        if (distance < bestDistance) {
          bestDistance = distance;
          bestDirection = direction;
        }
      }

      ghost.direction = bestDirection;
      ghost.nextDirection = bestDirection;
    }

    function updateGhosts(dt) {
      ghosts.forEach(ghost => {
        if (ghost.frightenedTimer > 0) {
          ghost.frightenedTimer -= dt;
        } else {
          ghost.frightened = false;
        }

        if (ghost.eaten) {
          ghost.speed = 155;
          ghost.frightened = false;

          if (ghost.row === 8 && ghost.col >= 9 && ghost.col <= 10) {
            ghost.eaten = false;
            ghost.speed = 82 + Math.min(level * 4, 24);
          }
        }

        const centerX = ghost.col * TILE + TILE / 2;
        const centerY = ghost.row * TILE + TILE / 2;

        if (
          Math.abs(ghost.x - centerX) < 1.2 &&
          Math.abs(ghost.y - centerY) < 1.2
        ) {
          snapToCell(ghost);
          chooseGhostDirection(ghost);
        }

        moveEntity(ghost, dt, true);
      });
    }

    function loseLife() {
      if (!gameStarted || gameOver || levelTransition) {
        return;
      }

      lives--;
      updateInterface();

      if (lives <= 0) {
        gameOver = true;
        gameStarted = false;
        messageElement.textContent = "GAME OVER — Press Restart";
        draw();
        return;
      }

      gameStarted = false;
      messageElement.textContent =
        "Caught! Press an arrow key to continue";

      resetPositions();
      draw();
    }

    function checkCollisions() {
      for (const ghost of ghosts) {
        const distance = Math.hypot(
          player.x - ghost.x,
          player.y - ghost.y
        );

        if (distance > TILE * .58) {
          continue;
        }

        if (ghost.frightened && !ghost.eaten) {
          ghost.eaten = true;
          ghost.frightened = false;
          ghost.frightenedTimer = 0;
          ghost.direction = directions.up;
          ghost.nextDirection = directions.up;

          frightenedChain++;
          score += 200 * Math.pow(
            2,
            Math.min(frightenedChain - 1, 3)
          );

          continue;
        }

        if (!ghost.eaten) {
          loseLife();
          return;
        }
      }
    }

    function pelletsRemaining() {
      return map
        .flat()
        .filter(cell => cell === PELLET || cell === POWER)
        .length;
    }

    function nextLevel() {
      if (levelTransition) {
        return;
      }

      levelTransition = true;
      gameStarted = false;
      level++;
      score += 1000;

      updateInterface();
      messageElement.textContent = `Level ${level}! Get ready...`;
      draw();

      setTimeout(() => {
        map = cloneMap();
        player = createPlayer();
        ghosts = createGhosts();
        levelTransition = false;
        messageElement.textContent =
          "Press an arrow key to continue";
        draw();
      }, 1100);
    }

    function updateInterface() {
      scoreElement.textContent = score.toLocaleString();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem(
          "neonMazeHighScore",
          String(highScore)
        );
      }

      highScoreElement.textContent = highScore.toLocaleString();
      livesElement.textContent = lives;
      levelElement.textContent = level;
    }

    function drawMaze(time) {
      ctx.save();

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = map[row][col];
          const x = col * TILE;
          const y = row * TILE;

          if (cell === WALL) {
            ctx.fillStyle = "#07184a";
            ctx.fillRect(x, y, TILE, TILE);

            ctx.strokeStyle = "#146bff";
            ctx.lineWidth = 2;
            ctx.strokeRect(
              x + 3,
              y + 3,
              TILE - 6,
              TILE - 6
            );

            ctx.strokeStyle = "rgba(0, 234, 255, .32)";
            ctx.lineWidth = 1;
            ctx.strokeRect(
              x + 7,
              y + 7,
              TILE - 14,
              TILE - 14
            );
          } else if (cell === GATE) {
            ctx.fillStyle = "#ff79e7";
            ctx.shadowColor = "#ff79e7";
            ctx.shadowBlur = 12;

            ctx.fillRect(
              x + 5,
              y + TILE / 2 - 2,
              TILE - 10,
              4
            );

            ctx.shadowBlur = 0;
          } else if (cell === PELLET) {
            ctx.beginPath();
            ctx.fillStyle = "#fff4ac";
            ctx.shadowColor = "#ffe600";
            ctx.shadowBlur = 8;

            ctx.arc(
              x + TILE / 2,
              y + TILE / 2,
              3.5,
              0,
              Math.PI * 2
            );

            ctx.fill();
            ctx.shadowBlur = 0;
          } else if (cell === POWER) {
            const pulse = 8 + Math.sin(time / 150) * 2.4;

            ctx.beginPath();
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 18;

            ctx.arc(
              x + TILE / 2,
              y + TILE / 2,
              pulse,
              0,
              Math.PI * 2
            );

            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }

      ctx.restore();
    }

    function drawPlayer() {
      const direction =
        player.direction === directions.none
          ? player.nextDirection
          : player.direction;

      const angle = Math.atan2(direction.y, direction.x);
      const mouth =
        .18 + Math.abs(Math.sin(player.mouth)) * .24;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(
        0,
        0,
        player.radius,
        mouth,
        Math.PI * 2 - mouth
      );
      ctx.closePath();

      ctx.fillStyle = "#ffe600";
      ctx.shadowColor = "#ffe600";
      ctx.shadowBlur = 18;
      ctx.fill();

      ctx.restore();
    }

    function drawGhost(ghost) {
      const x = ghost.x;
      const y = ghost.y;
      const radius = TILE * .34;

      ctx.save();

      if (ghost.eaten) {
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
      } else if (ghost.frightened) {
        ctx.fillStyle =
          ghost.frightenedTimer < 2
            ? Math.floor(performance.now() / 180) % 2
              ? "#ffffff"
              : "#3159ff"
            : "#3159ff";

        ctx.shadowColor = "#3159ff";
      } else {
        ctx.fillStyle = ghost.color;
        ctx.shadowColor = ghost.color;
      }

      ctx.shadowBlur = 14;

      if (ghost.eaten) {
        drawGhostEyes(x, y, radius);
        ctx.restore();
        return;
      }

      ctx.beginPath();
      ctx.arc(x, y - 2, radius, Math.PI, 0);
      ctx.lineTo(x + radius, y + radius);

      for (let i = 0; i < 3; i++) {
        const waveX = x + radius - i * radius * .66;

        ctx.lineTo(
          waveX - radius * .33,
          y + radius - 6
        );

        ctx.lineTo(
          waveX - radius * .66,
          y + radius
        );
      }

      ctx.lineTo(x - radius, y + radius);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;

      if (ghost.frightened) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(
          x - radius * .45,
          y + radius * .25
        );
        ctx.lineTo(
          x - radius * .2,
          y
        );
        ctx.lineTo(
          x,
          y + radius * .25
        );
        ctx.lineTo(
          x + radius * .2,
          y
        );
        ctx.lineTo(
          x + radius * .45,
          y + radius * .25
        );
        ctx.stroke();
      } else {
        drawGhostEyes(x, y, radius);
      }

      ctx.restore();
    }

    function drawGhostEyes(x, y, radius) {
      ctx.fillStyle = "#ffffff";

      ctx.beginPath();
      ctx.arc(
        x - radius * .38,
        y - radius * .15,
        radius * .22,
        0,
        Math.PI * 2
      );
      ctx.arc(
        x + radius * .38,
        y - radius * .15,
        radius * .22,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#17205d";

      ctx.beginPath();
      ctx.arc(
        x - radius * .38,
        y - radius * .12,
        radius * .1,
        0,
        Math.PI * 2
      );
      ctx.arc(
        x + radius * .38,
        y - radius * .12,
        radius * .1,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(0, 0, 20, .72)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffe600";
      ctx.font = "900 48px Arial";
      ctx.fillText(
        title,
        WIDTH / 2,
        HEIGHT / 2 - 18
      );

      ctx.fillStyle = "#ffffff";
      ctx.font = "700 18px Arial";
      ctx.fillText(
        subtitle,
        WIDTH / 2,
        HEIGHT / 2 + 25
      );
    }

    function draw(time = performance.now()) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawMaze(time);
      ghosts.forEach(drawGhost);
      drawPlayer();

      if (paused) {
        drawOverlay(
          "PAUSED",
          "Press Space, Escape, or Resume"
        );
      } else if (gameOver) {
        drawOverlay(
          "GAME OVER",
          "Press Restart or any direction"
        );
      } else if (levelTransition) {
        drawOverlay(
          `LEVEL ${level}`,
          "Get ready!"
        );
      }
    }

    function gameLoop(timestamp) {
      if (
        !gameStarted ||
        paused ||
        gameOver ||
        levelTransition
      ) {
        draw(timestamp);
        return;
      }

      const dt = Math.min(
        (timestamp - lastTime) / 1000,
        .05
      );

      lastTime = timestamp;

      updatePlayer(dt);
      updateGhosts(dt);
      checkCollisions();

      if (pelletsRemaining() === 0) {
        nextLevel();
      }

      updateInterface();
      draw(timestamp);

      animationId = requestAnimationFrame(gameLoop);
    }

    const keyMap = {
      ArrowUp: "up",
      w: "up",
      W: "up",
      ArrowDown: "down",
      s: "down",
      S: "down",
      ArrowLeft: "left",
      a: "left",
      A: "left",
      ArrowRight: "right",
      d: "right",
      D: "right"
    };

    document.addEventListener("keydown", event => {
      if (keyMap[event.key]) {
        event.preventDefault();
        setDirection(keyMap[event.key]);
      }

      if (event.key === " " || event.key === "Escape") {
        event.preventDefault();
        togglePause();
      }
    });

    pauseButton.addEventListener("click", togglePause);
    restartButton.addEventListener("click", resetGame);

    document
      .querySelectorAll("[data-direction]")
      .forEach(button => {
        button.addEventListener("click", () => {
          setDirection(button.dataset.direction);
        });
      });

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const dx = x - rect.width / 2;
      const dy = y - rect.height / 2;

      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? "right" : "left");
      } else {
        setDirection(dy > 0 ? "down" : "up");
      }
    });

    resetGame();
  </script>
</body>
</html>
